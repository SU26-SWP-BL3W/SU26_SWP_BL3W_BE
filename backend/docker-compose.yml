services:
  seal-db:
    image: postgres:15-alpine
    container_name: seal-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HihiSWPqualamet@
      POSTGRES_DB: SEAL-Database
    ports:
      - "5432:5432"
    volumes:
      - seal_db_data:/var/lib/postgresql/data

  seal-api:
    image: seal-backend-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seal-backend-api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Ip=seal-db
      - Database__Port=5432
      - Database__User=postgres
      - Database__Password=YourSecurePasswordHere
      - Database__Database=SEAL-Database
    depends_on:
      - seal-db

volumes:
  seal_db_data:
