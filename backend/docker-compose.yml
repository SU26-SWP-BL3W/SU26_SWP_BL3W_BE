services:
  seal-db:
    image: postgres:15-alpine
    container_name: seal-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong file .env cùng thư mục, không hardcode}
      POSTGRES_DB: ${DB_NAME:-SEAL-Database}
    ports:
      - "5432:5432"
    volumes:
      - seal_db_data:/var/lib/postgresql/data

  seal-api:
    image: seal-backend-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seal-backend-api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Ip=seal-db
      - Database__Port=5432
      - Database__User=${DB_USER:-postgres}
      - Database__Password=${DB_PASSWORD:?Đặt DB_PASSWORD trong file .env cùng thư mục, không hardcode}
      - Database__Database=${DB_NAME:-SEAL-Database}
    depends_on:
      - seal-db

volumes:
  seal_db_data:
