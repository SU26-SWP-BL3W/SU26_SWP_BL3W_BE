name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for .NET project
        id: dotnet_check
        run: |
          if find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" | grep -q .; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No .csproj found — skipping .NET build/test. Push .NET code to enable this pipeline."
          fi

      - name: Setup .NET
        if: steps.dotnet_check.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        if: steps.dotnet_check.outputs.found == 'true'
        run: dotnet restore backend/SEAL_Backend.slnx

      - name: Build
        if: steps.dotnet_check.outputs.found == 'true'
        run: dotnet build backend/SEAL_Backend.slnx --no-restore --configuration Release

      - name: Test
        if: steps.dotnet_check.outputs.found == 'true'
        run: dotnet test backend/SEAL_Backend.slnx --no-build --configuration Release --verbosity normal
